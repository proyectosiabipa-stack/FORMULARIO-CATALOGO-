<script>
  document.addEventListener("DOMContentLoaded", function() {
    const form = document.getElementById("bipaForm"); // Asegúrate de que tu <form> tenga id="bipaForm"
    const card = document.querySelector(".card");
    const submitBtn = document.getElementById("submitBtn");
    const errorBanner = document.getElementById("errorBanner");

    if (form) {
      form.addEventListener("submit", function(e) {
        e.preventDefault();
        
        // Validar honeypot antispam
        const hp = form.querySelector('input[name="website"]');
        if (hp && hp.value) return; 

        card.classList.add("is-loading");
        submitBtn.disabled = true;
        if (errorBanner) errorBanner.classList.remove("show");

        // Recopilar datos del formulario
        const formData = {
          nombre: form.querySelector('[name="nombre"]').value,
          telefono: form.querySelector('[name="telefono"]').value,
          email: form.querySelector('[name="email"]').value
        };

        // Enviar usando google.script.run
        google.script.run
          .withSuccessHandler(function(response) {
            card.classList.remove("is-loading");
            card.classList.add("is-success");
            const successState = document.getElementById("successState");
            if (successState) successState.classList.add("show");
          })
          .withFailureHandler(function(error) {
            card.classList.remove("is-loading");
            submitBtn.disabled = false;
            if (errorBanner) {
              errorBanner.textContent = "Hubo un error al registrarse. Inténtalo de nuevo.";
              errorBanner.classList.add("show");
            }
          })
          .procesarRegistro(formData);
      });
    }
  });

  function resetForm() {
    const card = document.querySelector(".card");
    const form = document.getElementById("bipaForm");
    const successState = document.getElementById("successState");
    const submitBtn = document.getElementById("submitBtn");
    
    if (form) form.reset();
    if (successState) successState.classList.remove("show");
    card.classList.remove("is-success");
    if (submitBtn) submitBtn.disabled = false;
  }
</script>
